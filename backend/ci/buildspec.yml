version: 0.2
env:
  shell: bash
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci --prefix backend --include=dev
  build:
    commands:
      - bash backend/ci/build-image.sh
  post_build:
    commands:
      - |
        set -euo pipefail
        if [[ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]]; then
          echo "Build failed; migrations and deployment were skipped." >&2
          exit 1
        fi
        node backend/ci/deploy-release.mjs
artifacts:
  files:
    - .release/image.json
